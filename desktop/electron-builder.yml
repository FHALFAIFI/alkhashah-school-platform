# Windows x64 offline installer (NSIS). Built only on Windows (see .github/workflows/windows-desktop.yml)
# after scripts/prepare-app.mjs (app tree) and scripts/fetch-binaries.mjs (pinned runtimes).
appId: sa.edu.alkhashah.fathersapp
productName: Father's App
executableName: FathersApp
copyright: "مجمع الخشعة التعليمي للبنين"
directories:
  output: dist
  buildResources: resources
# Only the launcher code goes into app.asar; everything heavy is an unpacked, read-only resource.
files:
  - main/**
  - lib/**
  - package.json
  - "!**/*.map"
asar: true
extraResources:
  # The Next.js server tree (build/server → resources/server) is NOT listed here: electron-builder
  # silently drops node_modules from extraResources. NSIS installs it verbatim instead
  # (resources/installer.nsh, customFiles_x64). Never name it "app": Electron would load
  # resources/app ahead of app.asar as the Electron application itself.
  - { from: vendor/node, to: node }
  - { from: vendor/pgsql, to: pgsql }
  - { from: vendor/chromium, to: chromium }
  - { from: vendor/poppler, to: poppler }
  - { from: vendor/BINARIES.lock.json, to: BINARIES.lock.json }
  - { from: guide, to: guide }
  - { from: THIRD_PARTY_NOTICES.md, to: THIRD_PARTY_NOTICES.md }
electronLanguages: [ar, en-US]
# Electron fuses (flipped in the shipped binary). FathersApp.exe cannot be abused as a generic
# Node.js runtime (ELECTRON_RUN_AS_NODE / NODE_OPTIONS), only app.asar can be loaded as the
# app, and the cookie store (session cookie) is encrypted with DPAPI.
# enableNodeCliInspectArguments stays on ONLY because the CI end-to-end test drives the
# installed app through the inspector; see docs/WINDOWS_RC1_READINESS.md (residual risk:
# someone who can already run programs as this Windows user can attach a debugger).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
  enableNodeCliInspectArguments: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
  # Not code-signed yet (no certificate provisioned) — see docs/WINDOWS_DESKTOP_PACKAGING.md §Signing.
  signAndEditExecutable: true
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: true
  # Per-machine install under Program Files: installed binaries are not writable by the
  # everyday (non-elevated) user; all data lives in %LOCALAPPDATA%\FathersApp.
  perMachine: true
  allowElevation: true
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Father's App"
  # Uninstalling never deletes school data, backups or keys.
  deleteAppDataOnUninstall: false
  artifactName: "FathersApp-Setup-${version}-x64.${ext}"
  include: resources/installer.nsh
  differentialPackage: false
publish: null
