<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:">
<title>منصة الإدارة المدرسية</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Tahoma, "Arial", sans-serif;
    background: #f7f6f2; color: #1a1a1a;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none; user-select: none;
  }
  .card { width: 100%; padding: 28px 32px; box-sizing: border-box; text-align: center; }
  h1 { font-size: 18px; color: #1f5244; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #555; margin-bottom: 22px; }
  .bar { height: 6px; background: #e4e1d8; border-radius: 3px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 35%; background: #348066; border-radius: 3px; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(120%); } 100% { transform: translateX(-320%); } }
  #status { margin-top: 16px; font-size: 14px; min-height: 22px; }
  #detail { margin-top: 6px; font-size: 12px; color: #777; min-height: 18px; }
</style>
</head>
<body>
  <div class="card">
    <h1>منصة الإدارة المدرسية المتكاملة</h1>
    <div class="sub">مجمع الخشعة التعليمي للبنين — يعمل على هذا الجهاز دون إنترنت</div>
    <div class="bar"><i></i></div>
    <div id="status">جارٍ التحضير…</div>
    <div id="detail"></div>
  </div>
</body>
</html>
