# مجمع الإنتاج للمنزل-المخبر (homelab) — التطبيق + PostgreSQL في شبكة Docker داخلية.
# القواعد الأمنية: PostgreSQL غير منشور إطلاقاً، والتطبيق يرتبط بـ 127.0.0.1 فقط،
# والوصول عن بُعد عبر Tailscale Serve على المضيف (لا Funnel). Ollama يبقى على المضيف
# (Mac) أو خدمة اختيارية (Ubuntu) — انظر docs/DOCKER_HOMELAB_DEPLOYMENT.md.
#
# الاستخدام:
#   docker compose -f compose.production.yml --env-file .env.production -p madrasa-prod up -d --build
# يشغّل init (هجرة + بذر مرجعي) مرة، ثم التطبيق. البيانات في وحدات تخزين دائمة.

name: madrasa-prod

x-app-build: &app-build
  build:
    context: .
    dockerfile: Dockerfile.production
  image: madrasa-app:${APP_VERSION:-0.1.0}
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-madrasa}:${POSTGRES_PASSWORD:?set in .env.production}@db:5432/${POSTGRES_DB:-madrasa}
    SESSION_SECRET: ${SESSION_SECRET:?set in .env.production}
    STORAGE_DIR: /data/storage
    BACKUP_DIR: /data/backups
    BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    APP_URL: ${APP_URL:-http://localhost:3080}
    APP_VERSION: ${APP_VERSION:-0.1.0}
    TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-*.ts.net}
    # TEMPORARY (principal LAN retest): when true, allows a non-Secure session cookie for plain-HTTP
    # requests on the trusted LAN. Default false — HTTPS (Tailscale) stays always-Secure. See .env.production.
    ALLOW_INSECURE_LAN_HTTP: ${ALLOW_INSECURE_LAN_HTTP:-false}
    AI_ENABLED: ${AI_ENABLED:-false}
    AI_PROVIDER: ${AI_PROVIDER:-ollama}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    NODE_ENV: production
  logging: &logging
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-madrasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-madrasa}
    # لا ports — PostgreSQL غير منشور (يُوصل فقط عبر الشبكة الداخلية)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-madrasa} -d ${POSTGRES_DB:-madrasa}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging

  # خدمة لمرة واحدة: **تطبيق الهجرات فقط**.
  #
  # كان هذا الأمر يشغّل `seed.ts` أيضاً في كل `compose up`. البذرة idempotent ولا تحذف ولا
  # تقتطع شيئاً — ولذلك لم تُفقد أي بيانات إنتاجية — لكن تشغيلها التلقائي يخالف القاعدة
  # القائمة «seed.ts لا يعمل على الإنتاج أبداً»، ويعني أن أي صف مرجعي يُضاف إلى بيانات
  # البذرة في إصدار لاحق كان سيُدرَج في الإنتاج صامتاً عند أول إعادة تشغيل.
  #
  # التثبيت الجديد يحتاج البذرة مرة واحدة (الأدوار والصلاحيات والمدرسة والتقويم)، ولذلك
  # بقيت متاحة في خدمة `seed` أدناه خلف profile صريح لا يعمل تلقائياً أبداً.
  init:
    <<: *app-build
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx tsx src/db/migrate.ts"]
    volumes:
      - storage:/data/storage
      - backups:/data/backups
    restart: "no"
    logging: *logging

  # البذر الأولي — **للتثبيت الجديد فقط**، ولا يعمل إلا باستدعاء صريح:
  #   docker compose -p madrasa-prod --profile bootstrap run --rm seed
  # لا تشغّله على قاعدة فيها بيانات مدرسة حقيقية.
  seed:
    <<: *app-build
    profiles: ["bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx tsx src/db/seed.ts"]
    volumes:
      - storage:/data/storage
      - backups:/data/backups
    restart: "no"
    logging: *logging

  app:
    <<: *app-build
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # يرتبط بالمضيف المحلي فقط افتراضياً — الوصول عبر Tailscale Serve على المضيف.
    # APP_BIND يسمح مؤقتاً بربط واجهة الشبكة المحلية (LAN IP) لاختبار المدير؛ الافتراضي 127.0.0.1.
    # Default binds to loopback only. Set APP_BIND=<LAN-IP> in .env.production ONLY for the temporary
    # principal retest, then remove it to return to localhost-only.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3080}:3080"
    # للوصول إلى Ollama على المضيف (Mac Apple Silicon أو Ubuntu بلا تسريع حاوية)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage:/data/storage
      - backups:/data/backups
    # نظام ملفات القراءة فقط حيث أمكن + مساحات كتابة مؤقتة للضروري
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging

volumes:
  pgdata:
  storage:
  backups:
